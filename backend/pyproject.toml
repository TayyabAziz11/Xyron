[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-operator"
version = "0.1.0"
description = "AI Operator — voice-first personal AI assistant that does real work"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "AI Operator", email = "noreply@ai-operator.app"}
]
dependencies = [
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=0.5.0",
    "openai>=1.50.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]
voice = [
    # openai-whisper and pyaudio were declared here but confirmed unused
    # (zero import sites anywhere in the codebase) in the 2026 platform-
    # stabilization audit — faster-whisper (a different package, declared
    # in requirements.txt) is the actual STT engine. Removed rather than
    # left as dead declarations.
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_operator*"]
