<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src http://localhost:8000">
  <title>AI Operator</title>
  <style>
    /* ── Design Tokens ─────────────────────────────────── */
    :root {
      --bg:            #08080f;
      --surface:       #0f0f1a;
      --card:          #13131f;
      --card-hover:    #181828;
      --border:        #1e1e30;
      --border-hi:     #2a2a42;
      --brand:         #7c3aed;
      --brand-light:   #8b5cf6;
      --brand-dim:     rgba(124,58,237,0.14);
      --brand-glow:    rgba(124,58,237,0.07);
      --text:          #f1f5f9;
      --text-sec:      #94a3b8;
      --text-muted:    #475569;
      --success:       #10b981;
      --warning:       #f59e0b;
      --error:         #ef4444;
      --r-sm:  6px;
      --r:    10px;
      --r-lg: 14px;
    }

    /* ── Reset ─────────────────────────────────────────── */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system,'Inter','Segoe UI',system-ui,sans-serif;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    textarea, input { user-select: text; }

    /* ── Scrollbar ─────────────────────────────────────── */
    ::-webkit-scrollbar { width:3px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--border-hi); }

    /* ── Titlebar ──────────────────────────────────────── */
    .titlebar {
      -webkit-app-region: drag;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tb-left  { display:flex; align-items:center; gap:8px; }
    .logo-dot {
      width:8px; height:8px; border-radius:50%;
      background:var(--brand);
      box-shadow: 0 0 8px rgba(124,58,237,0.7);
    }
    .logo-txt {
      font-size:11.5px; font-weight:700;
      letter-spacing:0.07em; text-transform:uppercase;
      color:var(--text-sec);
    }
    .tb-right { -webkit-app-region:no-drag; display:flex; gap:3px; }
    .win-btn {
      width:24px; height:24px; border:none; background:none;
      cursor:pointer; border-radius:5px;
      display:flex; align-items:center; justify-content:center;
      color:var(--text-muted); transition:all 0.15s;
    }
    .win-btn:hover { background:var(--surface); color:var(--text); }
    .win-btn.close:hover { background:rgba(239,68,68,0.15); color:var(--error); }

    /* ── Status Bar ────────────────────────────────────── */
    .status-bar {
      display:flex; align-items:center; justify-content:space-between;
      padding:6px 14px;
      background:var(--surface); border-bottom:1px solid var(--border);
      flex-shrink:0;
    }
    .sb-left  { display:flex; align-items:center; gap:6px; }
    .s-dot {
      width:6px; height:6px; border-radius:50%;
      background:var(--text-muted); flex-shrink:0;
      transition: background 0.3s;
    }
    .s-dot.on  { background:var(--success); box-shadow:0 0 5px var(--success); animation:blink 2.5s ease-in-out infinite; }
    .s-dot.off { background:var(--error); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .s-label { font-size:11px; color:var(--text-muted); }
    .int-row { display:flex; gap:10px; }
    .int-pip { display:flex; align-items:center; gap:4px; font-size:10px; color:var(--text-muted); }
    .int-pip .d { width:5px; height:5px; border-radius:50%; background:var(--border-hi); }
    .int-pip .d.on { background:var(--success); }

    /* ── Layout ────────────────────────────────────────── */
    .app { display:flex; flex-direction:column; height:100vh; }
    .body {
      flex:1; overflow-y:auto; padding:13px 14px;
      display:flex; flex-direction:column; gap:11px; min-height:0;
    }

    /* ── Input ─────────────────────────────────────────── */
    .sec-title {
      font-size:10px; font-weight:600;
      letter-spacing:0.08em; text-transform:uppercase;
      color:var(--text-muted); margin-bottom:6px;
    }
    .input-wrap {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--r); overflow:hidden; transition:border-color 0.2s;
    }
    .input-wrap:focus-within {
      border-color:var(--brand);
      box-shadow:0 0 0 3px var(--brand-glow);
    }
    textarea#cmd {
      display:block; width:100%; background:none; border:none; outline:none;
      color:var(--text); font-size:13px; font-family:inherit;
      resize:none; padding:11px 12px 7px; min-height:56px; max-height:96px;
      overflow-y:auto; line-height:1.55;
    }
    textarea#cmd::placeholder { color:var(--text-muted); }
    .input-foot {
      display:flex; align-items:center; justify-content:space-between;
      padding:6px 10px 8px; border-top:1px solid var(--border);
    }
    .imeta { display:flex; align-items:center; gap:8px; }
    .char-cnt { font-size:10px; color:var(--text-muted); }
    .kbd {
      display:inline-flex; align-items:center;
      padding:1px 5px; background:var(--card);
      border:1px solid var(--border-hi); border-radius:3px;
      font-size:10px; color:var(--text-muted);
    }
    .iact { display:flex; align-items:center; gap:5px; }

    /* ── Buttons ───────────────────────────────────────── */
    .btn {
      border:none; cursor:pointer; font-family:inherit;
      font-size:12px; font-weight:500; border-radius:var(--r-sm);
      display:inline-flex; align-items:center; gap:5px; transition:all 0.15s;
    }
    .btn:active { transform:scale(0.96); }
    .btn-pri  { background:var(--brand); color:#fff; padding:6px 14px; }
    .btn-pri:hover { background:var(--brand-light); }
    .btn-pri:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
    .btn-ghost { background:none; color:var(--text-muted); padding:5px 8px; border:1px solid var(--border); }
    .btn-ghost:hover { background:var(--surface); color:var(--text); border-color:var(--border-hi); }
    .btn-ico { background:none; color:var(--text-muted); padding:4px; border:1px solid var(--border); border-radius:var(--r-sm); }
    .btn-ico:hover { background:var(--surface); color:var(--text); }

    /* ── Mic ───────────────────────────────────────────── */
    .mic-btn {
      width:30px; height:30px; border-radius:50%;
      background:var(--card); border:1px solid var(--border);
      color:var(--text-muted); display:flex; align-items:center;
      justify-content:center; cursor:pointer; transition:all 0.2s;
    }
    .mic-btn:hover { border-color:var(--brand); color:var(--brand-light); background:var(--brand-dim); }
    .mic-btn.recording {
      background:rgba(239,68,68,0.12); border-color:var(--error); color:var(--error);
      animation:mic-pulse 1s ease-in-out infinite;
    }
    .mic-btn.thinking { background:var(--brand-dim); border-color:var(--brand); color:var(--brand-light); }
    @keyframes mic-pulse {
      0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.35)}
      50%{box-shadow:0 0 0 7px rgba(239,68,68,0)}
    }

    /* ── Spinner ───────────────────────────────────────── */
    @keyframes spin { to{transform:rotate(360deg)} }
    .spin { width:12px; height:12px; border:2px solid rgba(255,255,255,0.2); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; }

    /* ── Intent bar ────────────────────────────────────── */
    .intent-bar {
      display:none; align-items:center; gap:6px;
      padding:6px 10px;
      background:var(--brand-dim); border:1px solid rgba(124,58,237,0.22);
      border-radius:var(--r-sm); font-size:11px; color:var(--brand-light);
      animation:fadeSlide 0.2s ease;
    }
    .intent-bar.show { display:flex; }

    /* ── Transcript bar ────────────────────────────────── */
    .transcript-bar {
      display:none; align-items:center; gap:8px;
      padding:7px 10px;
      background:rgba(16,185,129,0.07); border:1px solid rgba(16,185,129,0.22);
      border-radius:var(--r-sm); font-size:11px;
      animation:fadeSlide 0.2s ease;
    }
    .transcript-bar.show { display:flex; }
    .tr-text { flex:1; color:var(--text-sec); font-style:italic; }
    .tr-icon { color:var(--success); }

    /* ── Result card ───────────────────────────────────── */
    .result-card {
      display:none; background:var(--card);
      border:1px solid var(--border); border-radius:var(--r); overflow:hidden;
      animation:fadeSlide 0.2s ease;
    }
    .result-card.show { display:block; }
    .result-head {
      display:flex; align-items:center; justify-content:space-between;
      padding:8px 11px; border-bottom:1px solid var(--border);
    }
    .rmeta { display:flex; align-items:center; gap:8px; }
    .chip {
      font-size:10px; font-weight:600; text-transform:uppercase;
      letter-spacing:0.05em; padding:2px 8px; border-radius:20px;
    }
    .c-queued    { background:rgba(71,85,105,0.22);  color:#94a3b8; }
    .c-running   { background:var(--brand-dim);       color:var(--brand-light); }
    .c-completed { background:rgba(16,185,129,0.12);  color:var(--success); }
    .c-failed    { background:rgba(239,68,68,0.12);   color:var(--error); }
    .ragent { font-size:11px; color:var(--text-muted); }
    .racts  { display:flex; gap:4px; }
    .result-body {
      padding:10px 12px; font-size:12px; color:var(--text-sec);
      line-height:1.65; white-space:pre-wrap; word-break:break-word;
      max-height:110px; overflow-y:auto;
    }
    .result-body.muted { color:var(--text-muted); font-style:italic; }

    /* ── Quick grid ────────────────────────────────────── */
    .quick-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
    .qc {
      background:var(--card); border:1px solid var(--border);
      border-radius:var(--r-sm); padding:9px 6px; cursor:pointer;
      text-align:center; transition:all 0.15s;
    }
    .qc:hover { background:var(--card-hover); border-color:var(--brand); transform:translateY(-1px); }
    .qc:active { transform:translateY(0); }
    .qc-ico  { font-size:16px; margin-bottom:3px; }
    .qc-lbl  { font-size:10px; color:var(--text-sec); font-weight:500; }

    /* ── Command list ──────────────────────────────────── */
    .cmd-list { display:flex; flex-direction:column; gap:4px; }
    .cmd-item {
      display:flex; align-items:center; gap:7px;
      padding:7px 10px; background:var(--card);
      border:1px solid var(--border); border-radius:var(--r-sm);
      cursor:pointer; transition:all 0.15s; animation:fadeSlide 0.2s ease;
    }
    .cmd-item:hover { background:var(--card-hover); border-color:var(--border-hi); }
    .ci-ico  { font-size:11px; flex-shrink:0; }
    .ci-txt  { flex:1; font-size:11px; color:var(--text-sec); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ci-bdg  { font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; padding:1px 6px; border-radius:20px; flex-shrink:0; }
    .b-completed { background:rgba(16,185,129,0.12); color:var(--success); }
    .b-running   { background:var(--brand-dim);       color:var(--brand-light); }
    .b-queued    { background:rgba(71,85,105,0.2);    color:#94a3b8; }
    .b-failed    { background:rgba(239,68,68,0.12);   color:var(--error); }
    .ci-time { font-size:10px; color:var(--text-muted); flex-shrink:0; }

    /* ── Empty ─────────────────────────────────────────── */
    .empty { text-align:center; padding:16px; color:var(--text-muted); font-size:11px; }
    .empty-ico { font-size:22px; margin-bottom:5px; opacity:0.35; }

    /* ── Footer ────────────────────────────────────────── */
    .footer {
      display:flex; align-items:center; justify-content:space-between;
      padding:8px 14px; border-top:1px solid var(--border);
      background:var(--surface); flex-shrink:0;
    }
    .f-version { font-size:10px; color:var(--text-muted); }
    .f-link {
      font-size:11px; color:var(--brand-light);
      background:none; border:none; cursor:pointer; font-family:inherit;
      display:flex; align-items:center; gap:4px; padding:4px 8px;
      border-radius:var(--r-sm); transition:all 0.15s;
    }
    .f-link:hover { background:var(--brand-dim); }

    /* ── Mic overlay ───────────────────────────────────── */
    .mic-overlay {
      display:none; position:fixed; inset:0;
      background:rgba(8,8,15,0.88); z-index:100;
      flex-direction:column; align-items:center; justify-content:center;
      gap:18px; backdrop-filter:blur(5px);
    }
    .mic-overlay.on { display:flex; animation:fadeIn 0.2s ease; }
    .mic-ring {
      width:88px; height:88px; border-radius:50%;
      background:rgba(239,68,68,0.1); border:2px solid var(--error);
      display:flex; align-items:center; justify-content:center;
      animation:ring 1s ease-in-out infinite;
    }
    @keyframes ring {
      0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.35)}
      50%{box-shadow:0 0 0 18px rgba(239,68,68,0)}
    }
    .mic-ring-ico { font-size:34px; }
    .mic-lbl { font-size:15px; font-weight:600; color:var(--text); }
    .mic-sub { font-size:11px; color:var(--text-muted); }
    .mic-stop {
      padding:8px 22px;
      background:rgba(239,68,68,0.12); border:1px solid var(--error);
      color:var(--error); border-radius:20px;
      cursor:pointer; font-family:inherit; font-size:12px; font-weight:500;
      transition:all 0.15s;
    }
    .mic-stop:hover { background:rgba(239,68,68,0.22); }

    /* ── Toast ─────────────────────────────────────────── */
    .toast {
      position:fixed; bottom:52px; left:50%;
      transform:translateX(-50%) translateY(8px);
      background:var(--card); border:1px solid var(--border-hi);
      border-radius:var(--r-sm); padding:6px 14px;
      font-size:11px; color:var(--text-sec);
      opacity:0; transition:all 0.2s;
      pointer-events:none; white-space:nowrap; z-index:999;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    .toast.ok  { border-color:rgba(16,185,129,0.4); color:var(--success); }
    .toast.err { border-color:rgba(239,68,68,0.4);  color:var(--error); }

    /* ── Animations ────────────────────────────────────── */
    @keyframes fadeIn    { from{opacity:0} to{opacity:1} }
    @keyframes fadeSlide { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:translateY(0)} }

    /* ── SVG icon helper ───────────────────────────────── */
    .ico { width:13px; height:13px; flex-shrink:0; }
  </style>
</head>
<body>
<div class="app">

  <!-- Titlebar -->
  <div class="titlebar">
    <div class="tb-left">
      <div class="logo-dot"></div>
      <span class="logo-txt">AI Operator</span>
    </div>
    <div class="tb-right">
      <button class="win-btn" title="Open Dashboard" onclick="op('openDashboard')">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M6 3H3a1 1 0 00-1 1v9a1 1 0 001 1h9a1 1 0 001-1v-3M10 2h4m0 0v4m0-4L7 9"/>
        </svg>
      </button>
      <button class="win-btn close" title="Hide (Esc)" onclick="op('hideWindow')">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M3 3l10 10M13 3L3 13"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="sb-left">
      <div class="s-dot" id="sDot"></div>
      <span class="s-label" id="sLabel">Connecting…</span>
    </div>
    <div class="int-row" id="intRow"></div>
  </div>

  <!-- Body -->
  <div class="body">

    <!-- Command input -->
    <div>
      <div class="sec-title">Command</div>
      <div class="input-wrap">
        <textarea id="cmd"
          placeholder="Tell AI Operator what to do…"
          maxlength="500"
          onkeydown="handleKey(event)"
          oninput="onInput()"></textarea>
        <div class="input-foot">
          <div class="imeta">
            <span class="char-cnt" id="cnt">0/500</span>
            <span style="font-size:10px;color:var(--text-muted)"><kbd class="kbd">Ctrl+↵</kbd> to run &nbsp;·&nbsp; <kbd class="kbd">Esc</kbd> to hide</span>
          </div>
          <div class="iact">
            <button class="mic-btn" id="micBtn" title="Voice input" onclick="toggleMic()">
              <svg class="ico" id="micIco" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="5" y="1" width="6" height="9" rx="3"/>
                <path d="M2 8a6 6 0 0012 0M8 14v2M5 16h6"/>
              </svg>
            </button>
            <button class="btn btn-pri" id="runBtn" onclick="submit()" disabled>
              <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M3 8h10M9 4l4 4-4 4"/>
              </svg>
              <span id="runLbl">Run</span>
              <div class="spin" id="runSpin" style="display:none"></div>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Intent preview -->
    <div class="intent-bar" id="intentBar">
      <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 2"/></svg>
      <span id="intentTxt">Detecting…</span>
    </div>

    <!-- Transcript bar -->
    <div class="transcript-bar" id="trBar">
      <span class="tr-icon">🎙</span>
      <span class="tr-text" id="trTxt"></span>
      <button class="btn-ico btn" style="padding:2px 5px;font-size:10px;" onclick="clearTr()">✕</button>
    </div>

    <!-- Result card -->
    <div class="result-card" id="resCard">
      <div class="result-head">
        <div class="rmeta">
          <span class="chip" id="resChip">—</span>
          <span class="ragent" id="resAgent"></span>
        </div>
        <div class="racts">
          <button class="btn btn-ico" title="Copy" onclick="copyRes()">
            <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 009.5 2h-6A1.5 1.5 0 002 3.5v6A1.5 1.5 0 003.5 11H5"/></svg>
          </button>
          <button class="btn btn-ico" title="Re-run" onclick="rerunLast()">
            <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 8a6 6 0 116 6"/><path d="M2 12V8h4"/></svg>
          </button>
          <button class="btn btn-ico" title="Dismiss" onclick="dismissRes()">
            <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3l10 10M13 3L3 13"/></svg>
          </button>
        </div>
      </div>
      <div class="result-body muted" id="resBody">Processing…</div>
    </div>

    <!-- Quick actions -->
    <div>
      <div class="sec-title">Quick actions</div>
      <div class="quick-grid">
        <div class="qc" onclick="fill('Summarize my unread emails')">
          <div class="qc-ico">📧</div><div class="qc-lbl">Emails</div>
        </div>
        <div class="qc" onclick="fill('Draft a LinkedIn post about AI productivity')">
          <div class="qc-ico">💼</div><div class="qc-lbl">LinkedIn</div>
        </div>
        <div class="qc" onclick="fill('Show pending approvals')">
          <div class="qc-ico">✅</div><div class="qc-lbl">Approvals</div>
        </div>
        <div class="qc" onclick="fill('Generate a daily summary report')">
          <div class="qc-ico">📊</div><div class="qc-lbl">Report</div>
        </div>
        <div class="qc" onclick="fill('List active workflows and status')">
          <div class="qc-ico">⚡</div><div class="qc-lbl">Workflows</div>
        </div>
        <div class="qc" onclick="fill('Check integration status')">
          <div class="qc-ico">🔌</div><div class="qc-lbl">Status</div>
        </div>
      </div>
    </div>

    <!-- Recent commands -->
    <div>
      <div class="sec-title">Recent commands</div>
      <div id="cmdList">
        <div class="empty"><div class="empty-ico">⬡</div>No commands yet</div>
      </div>
    </div>

  </div><!-- /body -->

  <!-- Footer -->
  <div class="footer">
    <span class="f-version">AI Operator · v0.1.0</span>
    <button class="f-link" onclick="op('openDashboard')">
      Open Dashboard
      <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M3 8h10M9 4l4 4-4 4"/>
      </svg>
    </button>
  </div>

</div><!-- /app -->

<!-- Mic overlay -->
<div class="mic-overlay" id="micOverlay">
  <div class="mic-ring"><span class="mic-ring-ico">🎙</span></div>
  <div class="mic-lbl" id="micLbl">Listening…</div>
  <div class="mic-sub">Speak clearly, then click stop</div>
  <button class="mic-stop" onclick="stopMic()">■ Stop Recording</button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
'use strict'

/* ── Bridge ───────────────────────────── */
const op  = (fn, ...args) => window.aiOperator?.[fn]?.(...args)
const API = 'http://localhost:8000'

/* ── State ────────────────────────────── */
let curId      = null   // current command id being polled
let pollTimer  = null
let isRunning  = false
let lastText   = ''     // for re-run
let mediaRec   = null
let audioChunks= []
let isRec      = false

/* ── Intent patterns (mirrors backend) ── */
const PATTERNS = [
  { keys:['linkedin'],                      label:'LinkedIn Agent',    agent:'linkedin'    },
  { keys:['whatsapp','wa '],                label:'WhatsApp Agent',    agent:'whatsapp'    },
  { keys:['instagram','ig '],               label:'Instagram Agent',   agent:'instagram'   },
  { keys:['odoo','invoice','accounting'],   label:'Odoo Agent',        agent:'odoo'        },
  { keys:['email','mail','inbox','gmail'],  label:'Email Agent',       agent:'email'       },
  { keys:['approval','approve','pending'],  label:'Approval Agent',    agent:'approval'    },
  { keys:['summary','report','briefing'],   label:'Reporting Agent',   agent:'reporting'   },
  { keys:['workflow','task'],               label:'Workflow Agent',    agent:'workflow'    },
  { keys:['integration','status','health'], label:'Integration Agent', agent:'integration' },
  { keys:['activity','log','history'],      label:'Activity Agent',    agent:'activity'    },
]
function localIntent(text) {
  const t = text.toLowerCase()
  return PATTERNS.find(p => p.keys.some(k => t.includes(k))) || { label:'General Agent', agent:'general' }
}

/* ── DOM ──────────────────────────────── */
const $ = id => document.getElementById(id)
const esc = s => s?.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') ?? ''

function showToast(msg, type='', ms=2200) {
  const t = $('toast')
  t.textContent = msg
  t.className = `toast ${type} show`
  clearTimeout(t._tid)
  t._tid = setTimeout(() => t.className = 'toast', ms)
}

/* ── Input handling ──────────────────── */
function onInput() {
  const v = $('cmd').value
  $('cnt').textContent = `${v.length}/500`
  $('runBtn').disabled = !v.trim() || isRunning

  const ib = $('intentBar')
  if (v.trim().length > 3) {
    const p = localIntent(v)
    $('intentTxt').textContent = `→ ${p.label}`
    ib.classList.add('show')
  } else {
    ib.classList.remove('show')
  }
}

function handleKey(e) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submit() }
  if (e.key === 'Escape') op('hideWindow')
}

function fill(text) {
  $('cmd').value = text
  onInput()
  $('cmd').focus()
}

/* ── Submit command ──────────────────── */
async function submit() {
  const text = $('cmd').value.trim()
  if (!text || isRunning) return

  lastText = text
  isRunning = true
  $('runBtn').disabled = true
  $('runLbl').style.display = 'none'
  $('runSpin').style.display = 'block'
  $('intentBar').classList.remove('show')

  showResult('queued', 'Routing command…', '')

  try {
    const r = await op('submitCommand', text, 'desktop')
    if (!r?.data) throw new Error('No API response')
    const d = r.data
    curId = d.id

    const intent = d.intent
    const agentLabel = intent
      ? `${intent.agent} · ${intent.skill.replace(/_/g,' ')}`
      : 'general'

    showResult(d.status, agentLabel, d.result || '')
    $('cmd').value = ''
    onInput()
    pollStart(d.id, agentLabel)

  } catch (err) {
    showResult('failed', 'Error', `Could not reach API.\n${err.message}`)
    resetRunBtn()
  }
}

function rerunLast() {
  if (!lastText) return
  fill(lastText)
  $('cmd').focus()
}

/* ── Result card ─────────────────────── */
const chipCls = { queued:'c-queued', running:'c-running', completed:'c-completed', failed:'c-failed' }

function showResult(status, agent, body) {
  const chip = $('resChip')
  chip.className = `chip ${chipCls[status] || 'c-queued'}`
  chip.textContent = status
  $('resAgent').textContent = agent

  const rb = $('resBody')
  rb.className = `result-body ${body ? '' : 'muted'}`
  rb.textContent = body || 'Processing…'
  $('resCard').classList.add('show')
}

function dismissRes() { $('resCard').classList.remove('show') }

function copyRes() {
  const t = $('resBody').textContent
  if (!t || t === 'Processing…') return
  op('copyText', t)
  showToast('Copied', 'ok')
}

/* ── Polling ─────────────────────────── */
function pollStart(id, agentLabel) {
  clearInterval(pollTimer)
  let n = 0
  pollTimer = setInterval(async () => {
    n++
    const r = await op('getCommand', id)
    if (!r?.data) { if (n > 25) clearInterval(pollTimer); return }
    const d = r.data
    showResult(d.status, agentLabel, d.result || '')
    if (d.status === 'completed' || d.status === 'failed') {
      clearInterval(pollTimer)
      resetRunBtn()
      if (d.status === 'completed') showToast('Done ✓', 'ok')
      else showToast('Failed', 'err')
      loadCmds()
    }
  }, 700)
}

function resetRunBtn() {
  isRunning = false
  $('runBtn').disabled = false
  $('runLbl').style.display = 'block'
  $('runSpin').style.display = 'none'
}

/* ── Recent commands ─────────────────── */
function relTime(iso) {
  const s = Math.floor((Date.now() - new Date(iso)) / 1000)
  if (s < 60) return `${s}s`
  if (s < 3600) return `${Math.floor(s/60)}m`
  return `${Math.floor(s/3600)}h`
}
const siIco = { completed:'✓', running:'◌', queued:'○', failed:'✗' }

async function loadCmds() {
  const r = await op('getCommands')
  const list = r?.data || []
  const el = $('cmdList')
  if (!list.length) {
    el.innerHTML = `<div class="empty"><div class="empty-ico">⬡</div>No commands yet</div>`
    return
  }
  el.innerHTML = list.slice(0,5).map(c => `
    <div class="cmd-item" onclick="fill(${JSON.stringify(c.text)})">
      <span class="ci-ico">${siIco[c.status] || '○'}</span>
      <span class="ci-txt">${esc(c.text)}</span>
      <span class="ci-bdg b-${c.status}">${c.status}</span>
      <span class="ci-time">${relTime(c.created_at)}</span>
    </div>
  `).join('')
}

/* ── Integrations strip ──────────────── */
async function loadInts() {
  const r = await op('getIntegrations')
  const list = r?.data || []
  $('intRow').innerHTML = list.slice(0,5).map(i => `
    <div class="int-pip" title="${i.name}: ${i.status}">
      <div class="d ${i.status==='connected'?'on':''}"></div>
      <span>${i.name.split(' ')[0]}</span>
    </div>`).join('')
}

/* ── Health ──────────────────────────── */
async function checkHealth() {
  const r = await op('getHealth')
  const ok = r?.data?.status === 'ok'
  $('sDot').className  = `s-dot ${ok ? 'on' : 'off'}`
  $('sLabel').textContent = ok ? 'Backend connected' : 'Backend offline'
}

/* ── Microphone ──────────────────────── */
async function toggleMic() {
  if (isRec) { stopMic(); return }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true })
    audioChunks = []
    mediaRec = new MediaRecorder(stream)
    mediaRec.ondataavailable = e => { if (e.data.size) audioChunks.push(e.data) }
    mediaRec.onstop = transcribeAudio
    mediaRec.start(100)
    isRec = true
    $('micBtn').classList.add('recording')
    $('micOverlay').classList.add('on')
  } catch {
    showToast('Microphone access denied', 'err')
  }
}

function stopMic() {
  if (!mediaRec || !isRec) return
  isRec = false
  mediaRec.stop()
  mediaRec.stream.getTracks().forEach(t => t.stop())
  $('micBtn').classList.remove('recording')
  $('micBtn').classList.add('thinking')
  $('micOverlay').classList.remove('on')
}

async function transcribeAudio() {
  if (!audioChunks.length) { $('micBtn').classList.remove('thinking'); return }
  const blob = new Blob(audioChunks, { type:'audio/webm' })
  const form = new FormData()
  form.append('audio', blob, 'recording.webm')
  try {
    const resp = await fetch(`${API}/api/v1/voice/transcribe`, { method:'POST', body:form })
    const data = await resp.json()
    const text = data?.data?.text?.trim() || ''
    $('micBtn').classList.remove('thinking')
    if (text) {
      $('cmd').value = text
      onInput()
      $('trTxt').textContent = `"${text}"`
      $('trBar').classList.add('show')
      showToast('Voice captured — review and run', 'ok')
    } else {
      showToast('No speech detected', 'err')
    }
  } catch {
    $('micBtn').classList.remove('thinking')
    showToast('Transcription failed', 'err')
  }
}

function clearTr() { $('trBar').classList.remove('show') }

/* ── Global keys ─────────────────────── */
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !isRec) op('hideWindow')
})

/* ── Init ────────────────────────────── */
;(async function init() {
  await checkHealth()
  await loadCmds()
  await loadInts()
  setInterval(checkHealth, 12000)
  setInterval(loadCmds,    8000)
  setInterval(loadInts,    30000)
  setTimeout(() => $('cmd')?.focus(), 150)
})()
</script>
</body>
